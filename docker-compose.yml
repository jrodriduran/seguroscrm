services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: seguroscrm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - seguroscrm_net

  webserver:
    image: nginx:alpine
    container_name: seguroscrm_webserver
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - seguroscrm_net

  db:
    image: mysql:8.0
    container_name: seguroscrm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seguroscrm
      MYSQL_USER: seguroscrm_user
      MYSQL_PASSWORD: seguroscrm_password
      MYSQL_ROOT_PASSWORD: secret_db_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      seguroscrm_net:
        aliases:
          - mysql
          - db

networks:
  seguroscrm_net:
    driver: bridge

volumes:
  db_data:
    driver: local