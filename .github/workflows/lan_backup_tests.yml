name: LAN backup tests

on:
  push:
    paths:
      - 'deploy/lan/**'
      - '.github/workflows/lan_backup_tests.yml'
  pull_request:
    paths:
      - 'deploy/lan/**'
      - '.github/workflows/lan_backup_tests.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s deploy/lan -p 'test_*.py' -v
